openapi: 3.0.3
info:
  title: Looking For Group API
  version: 1.0.0
  description: |
    LFG API Documentation. This will showcase all the endpoints available and how to use them.
    Note: When accessed directly from the express app, the endpoints will have an additional "/api" prefix.
    Because of this, please use the vite proxy when reviewing the docs.
paths:
  # DATASETS
  /api/datasets/roles:
    get:
      summary: Returns a list of all roles
      tags:
        - Datasets
      responses:
        '200':
          description: List of all the roles available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/datasets/socials:
    get:
      summary: Receives list of all socials
      tags:
        - Datasets
      responses:
        '200':
          description: A list of social platforms
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Social'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/datasets/skills:
    get:
      summary: Receives list of all skills
      tags:
        - Datasets
      responses:
        '200':
          description: A list of skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/datasets/mediums:
    get:
      summary: Receives list of all mediums
      tags:
        - Datasets
      responses:
        '200':
          description: A list of mediums
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Medium'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/datasets/majors:
    get:
      summary: Receives list of all majors
      tags:
        - Datasets
      responses:
        '200':
          description: A list of majors
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Major'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/datasets/tags:
    get:
      summary: Receives list of all tags
      tags:
        - Datasets
      responses:
        '200':
          description: A list of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # USERS
  /api/users/all/{method}:
    get:
      summary: Get all users
      tags:
        - Users
      parameters:
        - in: path
          name: method
          required: true
          schema:
            type: string
          description: Sorting method (options are "Newest" for newest first and "A-Z" for alphabetical)
        - in: query
          name: strictness
          required: false
          schema:
            type: string
          description: The strictness with which to apply the filters (return if they match either any of the filters or all of them)
        - in: query
          name: mentor
          required: false
          schema:
            type: boolean
        - in: query
          name: designer
          required: false
          schema:
            type: boolean
        - in: query
          name: developer
          required: false
          schema:
            type: boolean
        - in: query
          name: skills
          required: false
          schema:
            type: string
        - in: query
          name: majors
          required: false
          schema:
            type: string
        - in: query
          name: ritStatus
          required: false
          schema:
            type: string
        - in: query
          name: socials
          required: false
          schema:
            type: string

          description: The filters to apply on users that you wish to get
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users:
    post:
      summary: Create a user
      tags:
        - Users
      parameters:
        - in: query
          name: devFirstName
          required: false
          schema:
            type: string
          description: The first name to be used as the current first name
        - in: query
          name: devLastName
          required: false
          schema:
            type: string
          description: The last name to be used as the current last name
        - in: query
          name: devEmail
          required: false
          schema:
            type: string
          description: The email to be used as the current email
        - in: query
          name: devUID
          required: false
          schema:
            type: string
          description: The UID to be used as the current UID
      security:
        shibbolethAuth: []
      responses:
        '201':
          description: User Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/MePrivate'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}:
    get:
      summary: Get a user by their ID
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the user to retrieve
      responses:
        '200':
          description: User found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/UserDetail'

  /api/users/search-username/{username}:
    get:
      summary: Get user by username
      tags:
        - Users
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: The username of the user to retrieve
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/UserPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/search-email/{email}:
    get:
      summary: Get user by email
      tags:
        - Users
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
          description: The RIT email of the user to retrieve
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/UserPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/search-google/{id}:
    get:
      summary: Get user by google ID
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The Google ID of the user to retrieve
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/UserPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/projects:
    get:
      summary: Get another user's projects
      description: Retrieve projects of a user (not current user)
      tags:
        - Users
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of projects for the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/followings/projects:
    get:
      summary: Get projects a user is following
      tags:
        - Users
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of projects the user is following
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/ProjectFollowsList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/followings/people:
    get:
      tags:
        - Users
      summary: Get list of users that the specified user is following
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of users the current user is following
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/UserFollowsList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/followers:
    get:
      tags:
        - Users
      summary: Get list of users that follow the specified user
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of users following current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/UserFollowsList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/blacklist:
    get:
      tags:
        - Users
      summary: Get list of users that is banned/on the blacklist
      responses:
        '200':
          description: List of users that are banned/on the blacklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    nullable: true
                    example: []
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ME
  /api/me:
    get:
      summary: Gets the current user
      tags:
        - Me
      security:
        - shibbolethAuth: []
      parameters:
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
      responses:
        '200':
          description: A single user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/MePrivate'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Updates user profile information
      tags:
        - Me
      x-middleware:
        - injectCurrentUser
      security:
        - shibbolethAuth: []
      parameters:
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'

      responses:
        '200':
          description: Update a single user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    $ref: '#/components/schemas/MePrivate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a user by ID
      tags:
        - Me
      security:
        - shibbolethAuth: []
      parameters:
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
      responses:
        '200':
          description: User successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: object
                    nullable: true
                    example: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/get-username:
    get:
      summary: Get username through Shibboleth headers
      tags:
        - Me
      security:
        - shibbolethAuth: []
      description: |
        Retrieves the username of the current user authenticated via Shibboleth. Needs the uid header
      parameters:
        - in: header
          name: uid
          required: true
          schema:
            type: string
          description: Google ID from the Google OAuth response
      responses:
        '200':
          description: Username successfully retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      userId:
                        type: integer
              examples:
                default:
                  summary: Example response
                  value:
                    status: 200
                    error: null
                    data:
                      username: mistahbones
                      userId: 18
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/projects:
    get:
      summary: Get current user's own projects
      description: Returns the list of projects owned by the user identified by userID.
      tags:
        - Me
      security:
        - shibbolethAuth: []
      parameters:
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
        - in: query
          name: visibility
          schema:
            type: string
            enum: [all, public, private]
          required: false
          description: Filter for visibility (accepts all, public, or private)
        - in: query
          name: owner
          schema:
            type: string
            enum: [all, me]
          required: false
          description: Filter for whether or not you are the project owner
      responses:
        '200':
          description: List of projects owned by the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/projects/{id}/leave:
    delete:
      summary: Leave a specified project
      description: Deletes the Members object associated with the logged in user and a project
      tags:
        - Me
      security:
        - shibbolethAuth: []
      parameters:
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
        - in: path
          name: id
          schema:
            type: integer
          required: false
          description: The project ID of the project being left
      responses:
        '200':
          description: Successfully left project
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: object
                    nullable: true
                    example: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/projects/{id}/visibility:
    put:
      summary: Set a project's profile visibility
      description: Set the visibility of a project on the user's profile (unique to the user, accepts 'public' or 'private')
      tags:
        - Me
      security:
        - shibbolethAuth: []
      parameters:
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
        - in: path
          name: id
          schema:
            type: integer
          required: false
          description: The ID of the project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profileVisibility:
                  type: string
                  example: 'public'
      responses:
        '200':
          description: Visibility set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: object
                    $ref: '#/components/schemas/MyMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/projects/report/{id}:
    post:
      summary: Report a project
      security:
        - shibbolethAuth: []
      tags:
        - Me
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the project to report
          schema:
            type: integer
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectReportInput'
      responses:
        '200':
          description: Project reported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: object
                    nullable: true
                    example: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/socials:
    get:
      summary: Get current user's socials
      description: Returns the list of socials associated with the current user
      tags:
        - Me
      security:
        - shibbolethAuth: []
      parameters:
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
      responses:
        '200':
          description: List of socials the current user has
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MySocial'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Adds a user social
      description: Adds a specified social to the current user
      security:
        - shibbolethAuth: []
      tags:
        - Me
      parameters:
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserSocialInput'
      responses:
        '201':
          description: Social created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
                    type: object
                    $ref: '#/components/schemas/MySocial'

        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/socials/{id}:
    patch:
      summary: Updates a user social
      description: Updates one of the socials specified by the current user
      security:
        - shibbolethAuth: []
      tags:
        - Me
      parameters:
        - name: id
          in: path
          required: true
          description: The DB id of the user social being changed
          schema:
            type: integer
        - in: query
          name: devId
          schema:
            type: integer
          required: false
          description: The user ID to be used as the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSocialInput'
      responses:
        '200':
          description: Social created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  error:
                    type: string
                    nullable: true
                    example: null
                  data:
