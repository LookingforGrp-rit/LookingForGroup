    AddProjectTagInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/AddProjectTagInput'
    UpdateProjectTagInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/UpdateProjectTagInput'
    AddProjectMediumsInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/AddProjectMediumsInput'
    CreateProjectJobInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/CreateProjectJobInput'
    UpdateProjectJobInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/UpdateProjectJobInput'
    CreateProjectVideoInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/CreateProjectVideoInput'
    CreateMemberRequestInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/CreateMemberRequestInput'
    TagWithIdInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/TagWithIdInput'
    TagInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/TagInput'
    SkillInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/SkillInput'
    AddUserReportInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/AddUserReportInput'
    AddProjectReportInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/AddProjectReportInput'
    BanUserInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/BanUserInput'
    ModeratorNotificationInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/ModeratorNotificationInput'
    AddBugReportInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/AddBugReportInput'
    UpdateBugReportInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/UpdateBugReportInput'

    ErrorMessage:
      type: object
      properties:
        status:
          type: integer
          example: 500
        error:
          type: string
          example: Internal Server Error
        data:
          type: string
          nullable: true
          example: null
      required:
        - status
        - error
        - data

  responses:
    InternalServerError:
      description: An internal server error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 500
                error: Internal Server Error
                data: null
    BadRequest:
      description: The request was invalid (e.g., malformed parameters)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 400
                error: Invalid parameter(s)
                data: null
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 404
                error: Not found
                data: null
    Unauthorized:
      description: Authentication is required and has failed or has not been provided
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                error: Unauthorized
                data: null
    Forbidden:
      description: Proper credentials have been provided, but such credentials are not authorized to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 409
                error: Forbidden
                data: null
    Conflict:
      description: Conflict to show resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 409
                error: Resource already exists
                data: null
