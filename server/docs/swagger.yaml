    BugReport:
      $ref: 'schemas/users.yaml#/components/schemas/BugReport'

    MySkill:
      $ref: 'schemas/me.yaml#/components/schemas/MySkill'
    MySocial:
      $ref: 'schemas/me.yaml#/components/schemas/MySocial'
    MyMajor:
      $ref: 'schemas/me.yaml#/components/schemas/MyMajor'
    MyFollowing:
      $ref: 'schemas/me.yaml#/components/schemas/MyFollowing'
    MyFollowsList:
      $ref: 'schemas/me.yaml#/components/schemas/MyFollowsList'
    MyProjectFollowing:
      $ref: 'schemas/me.yaml#/components/schemas/MyProjectFollowing'
    MyProjectFollowsList:
      $ref: 'schemas/me.yaml#/components/schemas/MyProjectFollowsList'
    MePreview:
      $ref: 'schemas/me.yaml#/components/schemas/MePreview'
    MeDetail:
      $ref: 'schemas/me.yaml#/components/schemas/MeDetail'
    MePrivate:
      $ref: 'schemas/me.yaml#/components/schemas/MePrivate'
    MyMember:
      $ref: 'schemas/me.yaml#/components/schemas/MyMember'

    ProjectImage:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectImage'
    ProjectMedium:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectMedium'
    ProjectFollowers:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectFollowers'
    ProjectFollower:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectFollower'
    ProjectMember:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectMember'
    ProjectMemberRequest:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectMemberRequest'
    ProjectSocial:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectSocial'
    ProjectTag:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectTag'
    ProjectJob:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectJob'
    ProjectPreview:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectPreview'
    ProjectDetail:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectDetail'
    ProjectWithFollowers:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectWithFollowers'
    ProjectVideo:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectVideo'
    ProjectReport:
      $ref: 'schemas/projects.yaml#/components/schemas/ProjectReport'

    UpdateUserInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/UpdateUserInput'
    AddUserSocialInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/AddUserSocialInput'
    UpdateUserSocialInput:
      $ref: 'schemas/inputs.yaml#/components/schemas/UpdateUserSocialInput'
    AddUserSkillsInput:
