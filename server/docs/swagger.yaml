  /api/projects/{id}/change-owner/{userId}:
    $ref: './paths/projects/members/change-owner.yaml'
  /api/projects/{id}/members/{userId}/invite:
    $ref: './paths/projects/members/member-invite.yaml'

  # APPROVAL
  /api/projects/unapproved:
    $ref: './paths/projects/approval/unapproved.yaml'
  /api/projects/unapproved/{id}:
    $ref: './paths/projects/approval/unapproved-id.yaml'
  /api/projects/{id}/approve:
    $ref: './paths/projects/approval/approve.yaml'
  /api/projects/{id}/unapprove:
    $ref: './paths/projects/approval/unapprove.yaml'

  # USERS
  /api/users/all/{method}:
    $ref: './paths/users/get-all.yaml'
  /api/users:
    $ref: './paths/users/create.yaml'
  /api/users/{id}:
    $ref: './paths/users/get-id.yaml'
  /api/users/search-username/{username}:
    $ref: './paths/users/search-username.yaml'
  /api/users/search-email/{email}:
    $ref: './paths/users/search-email.yaml'
  /api/users/search-google/{id}:
    $ref: './paths/users/search-google.yaml'
  /api/users/{id}/projects:
    $ref: './paths/users/projects.yaml'
  /api/users/{id}/followings/projects:
    $ref: './paths/users/followings-projects.yaml'
  /api/users/{id}/followings/people:
    $ref: './paths/users/followings-people.yaml'
  /api/users/{id}/followers:
    $ref: './paths/users/followers.yaml'
  /api/users/blacklist:
    $ref: './paths/users/blacklist.yaml'
  /api/users/blacklist/{id}:
    $ref: './paths/users/blacklist-id.yaml'

# COMPONENTS
components:
  securitySchemes:
    shibbolethAuth:
      #Filler values need to be changed
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Role:
      $ref: 'schemas/datasets.yaml#/components/schemas/Role'
    Major:
      $ref: 'schemas/datasets.yaml#/components/schemas/Major'
    Tag:
      $ref: 'schemas/datasets.yaml#/components/schemas/Tag'
    Social:
      $ref: 'schemas/datasets.yaml#/components/schemas/Social'
    Skill:
      $ref: 'schemas/datasets.yaml#/components/schemas/Skill'
    Medium:
      $ref: 'schemas/datasets.yaml#/components/schemas/Medium'

    UserMember:
      $ref: 'schemas/users.yaml#/components/schemas/UserMember'
    UserSkill:
      $ref: 'schemas/users.yaml#/components/schemas/UserSkill'
    UserSocial:
      $ref: 'schemas/users.yaml#/components/schemas/UserSocial'
    ProjectFollowsList:
      $ref: 'schemas/users.yaml#/components/schemas/ProjectFollowsList'
    ProjectFollowing:
