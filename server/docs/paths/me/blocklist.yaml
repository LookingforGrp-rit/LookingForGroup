get:
  summary: Gets previews of all users in the blacklist of me.
  tags:
    - Me
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: true
      description: The user Id to be used as 'me'
  responses:
    '200':
      description: Blocklist acquired successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: array
                items:
                  $ref: '../../swagger.yaml#/components/schemas/UserPreview'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
post:
  summary: Blocks a user.
  tags:
    - Me
  description: Adds a user by userId to the blocklist of me.
  parameters:
    - in: query
      name: devId
      required: true
      schema:
        type: integer
      description: The id to be used as 'me.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            userId:
              type: integer
              required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: string
                example: 'User added to blocklist.'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '409':
      $ref: '../../swagger.yaml#/components/responses/Conflict'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
delete:
  summary: Unblocks a user.
  tags:
    - Me
  description: Removes a user by userId from the blocklist of me.
  parameters:
    - in: query
      name: devId
      required: true
      schema:
        type: integer
      description: The id to be used as 'me.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            userId:
              type: integer
              required: true
  responses:
    '204':
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 204
              error:
                type: string
                nullable: true
                example: null
              data:
                type: string
                example: 'User removed from blocklist.'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '409':
      $ref: '../../swagger.yaml#/components/responses/Conflict'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
