patch:
  summary: Updates a user social
  description: Updates one of the socials specified by the current user
  security:
    - shibbolethAuth: []
  tags:
    - Me
  parameters:
    - name: id
      in: path
      required: true
      description: The DB id of the user social being changed
      schema:
        type: integer
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../swagger.yaml#/components/schemas/UpdateUserSocialInput'
  responses:
    '200':
      description: Social created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                $ref: '../../swagger.yaml#/components/schemas/MySocial'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
delete:
  summary: Delete one of the current user's socials
  security:
    - shibbolethAuth: []
  tags:
    - Me
  parameters:
    - name: id
      in: path
      required: true
      description: DB id of the social to be deleted
      schema:
        type: integer
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Social deleted successfully
      content:
        application/json:
          example:
            status: 200
            error: null
            data: null
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
