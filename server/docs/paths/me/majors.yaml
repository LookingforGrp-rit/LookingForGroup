get:
  summary: Get current user's majors
  description: Returns the list of majors current user has
  tags:
    - Me
  security:
    - googleOAuth: []
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The current user ID
  responses:
    '200':
      description: List of majors current user has
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: array
                items:
                  $ref: '../../swagger.yaml#/components/schemas/MyMajor'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
post:
  summary: Adds a user major
  description: Adds a major to current user
  tags:
    - Me
  security:
    - googleOAuth: []
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The current user ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../swagger.yaml#/components/schemas/AddUserMajorInput'
  responses:
    '201':
      description: Skill created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              error:
                type: string
                nullable: true
                example: null
              data:
                $ref: '../../swagger.yaml#/components/schemas/MyMajor'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
