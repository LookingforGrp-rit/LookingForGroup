patch:
  summary: Updates a user skill
  description: Updates all of the skills specified for the current user
  security:
    - shibbolethAuth: []
  tags:
    - Me
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: The ID of the skill to be updated
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../swagger.yaml#/components/schemas/UpdateUserSkillInput'
  responses:
    '200':
      description: Skill updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                properties:
                  apiUrl:
                    type: string
                    example: 'api/me/skills/77'
                  proficiency:
                    type: string
                    example: 'Novice'
                  position:
                    type: integer
                    example: 8
                  skillId:
                    type: integer
                    example: 77
                  label:
                    type: string
                    example: 'API'
                  type:
                    type: string
                    example: 'Developer'
                  category:
                    type: string
                    example: 'Discipline'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
delete:
  summary: Delete a user skill
  security:
    - shibbolethAuth: []
  tags:
    - Me
  parameters:
    - in: query
      name: id
      schema:
        type: integer
      required: true
      description: The ID of the skill to be deleted
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Skills deleted successfully
      content:
        application/json:
          example:
            status: 200
            error: null
            data: null
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
