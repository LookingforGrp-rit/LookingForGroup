get:
  summary: Get current user's own projects
  description: Returns the list of projects owned by the user identified by userID.
  tags:
    - Me
  security:
    - shibbolethAuth: []
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
    - in: query
      name: visibility
      schema:
        type: string
        enum: [all, public, private]
      required: false
      description: Filter for visibility (accepts all, public, or private)
    - in: query
      name: owner
      schema:
        type: string
        enum: [all, me]
      required: false
      description: Filter for whether or not you are the project owner
  responses:
    '200':
      description: List of projects owned by the user
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: array
                items:
                  $ref: '../../swagger.yaml#/components/schemas/ProjectPreview'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '401':
      $ref: '../../swagger.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
