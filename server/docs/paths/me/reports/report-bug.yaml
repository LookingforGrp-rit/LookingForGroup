post:
  summary: Report a bug
  security:
    - googleOAuth: []
  tags:
    - Me Reports
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../swagger.yaml#/components/schemas/AddBugReportInput'
  responses:
    '200':
      description: Report created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                nullable: true
                example: null
    '409':
      $ref: '../../../swagger.yaml#/components/responses/Conflict'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
