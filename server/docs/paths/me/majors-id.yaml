delete:
  summary: Delete current users major
  description: Removes specified major from the current user
  tags:
    - Me
  security:
    - shibbolethAuth: []
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
    - in: query
      name: devId
      schema:
        type: integer
      required: false
  responses:
    '200':
      description: Major deleted successfully
      content:
        application/json:
          example:
            status: 200
            error: null
            data: null
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
