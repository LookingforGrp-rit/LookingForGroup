/api/users/{id}/projects:
  get:
    summary: Get another user's projects
    description: Retrieve projects of a user (not current user)
    tags:
      - Users
    parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: A list of projects for the user
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: array
                  items:
                    $ref: '../swagger.yaml#/components/schemas/ProjectPreview'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
