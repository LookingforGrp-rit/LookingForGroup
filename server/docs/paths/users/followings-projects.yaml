get:
  summary: Get projects a user is following
  tags:
    - Users
  parameters:
    - name: id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: List of projects the user is following
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                $ref: '../../swagger.yaml#/components/schemas/ProjectFollowsList'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
