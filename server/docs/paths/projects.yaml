# PROJECTS
/api/projects:
  get:
    summary: Get all projects
    tags:
      - Projects
    description: Retrieves a list of all projects.
    responses:
      '200':
        description: A list of projects
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: array
                  items:
                    $ref: '../swagger.yaml#/components/schemas/ProjectPreview'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
  post:
    summary: Create a new project
    description: Creates a new project using the request body
    tags:
      - Projects
    security:
      - shibbolethAuth: []
    parameters:
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../swagger.yaml#/components/schemas/CreateProjectInput'
    responses:
      '201':
        description: Project created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 201
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  $ref: '../swagger.yaml#/components/schemas/ProjectDetail'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/projects/paginated/{count}/{id}/{method}:
  get:
    summary: Get paginated projects
    tags:
      - Projects
    description: Retrieves a list of paginated projects.
    parameters:
      - in: path
        name: count
        required: true
        schema:
          type: integer
        description: The maximum number of projects to return
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The project ID cursor. Projects after this ID will be returned. Use 0 to start from the beginning.
      - in: path
        name: method
        required: true
        schema:
          type: string
        description: Sorting method (options are "Newest" for newest first and "A-Z" for alphabetical)
    responses:
      '200':
        description: A list of projects
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: array
                  items:
                    $ref: '../swagger.yaml#/components/schemas/ProjectPreview'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/projects/{id}:
  get:
    summary: Get project by ID
    tags:
      - Projects
    description: Gets information about a single project by its project ID.
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Project ID
    responses:
      '200':
        description: Project found and returned
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  $ref: '../swagger.yaml#/components/schemas/ProjectWithFollowers'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
  patch:
    summary: Updates project information
    tags:
      - Projects
    security:
      - shibbolethAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The project ID
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../swagger.yaml#/components/schemas/UpdateProjectInput'
    responses:
      '200':
        description: Update a single project
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  $ref: '../swagger.yaml#/components/schemas/ProjectDetail'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
  delete:
    summary: Delete a project by ID
    description: Deletes a project by its ID.
    tags:
      - Projects
    security:
      - shibbolethAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the project to delete
        schema:
          type: integer
      - name: devId
        in: query
        required: false
        description: The ID to be used as the current user
        schema:
          type: integer
    responses:
      '200':
        description: Project deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: object
                  nullable:
                  example: null
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/projects/{id}/thumbnail:
  get:
    summary: Get thumbnail by project ID
    tags:
      - Projects
    description: Gets a prject's thumbnail by its ID.
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Project ID
    responses:
      '200':
        description: Thumbnail found and returned
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  $ref: '../swagger.yaml#/components/schemas/ProjectImage'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
  put:
    summary: Updates a thumbnail
    tags:
      - Projects
    security:
      - shibbolethAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The project ID
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              thumbnail:
                type: integer
                required: true
    responses:
      '200':
        description: Project thumbnail successfully updated
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  $ref: '../swagger.yaml#/components/schemas/ProjectImage'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
  delete:
    summary: Remove a project's thumbnail
    description: Removes a project's thumbnail by the project's ID. This does NOT delete the project image itself.
    tags:
      - Projects
    security:
      - shibbolethAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the project whose thumbnail to remove
        schema:
          type: integer
      - name: devId
        in: query
        required: false
        description: The ID to be used as the current user
