/api/mod/ban-user/{id}:
  post:
    summary: Bans a user by adding them to a blacklist
    tags:
      - Mod
    security:
      - shibbolethAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: User ID of the user to be banned
        schema:
          type: string
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../swagger.yaml#/components/schemas/BanUserInput'
    responses:
      '200':
        description: User banned successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: object
                  nullabe: true
                  example: null
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '409':
        $ref: '../swagger.yaml#/components/responses/Conflict'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/mod/notification:
  post:
    summary: Sends a notification to a user
    tags:
      - Mod
    security:
      - shibbolethAuth: []
    parameters:
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../swagger.yaml#/components/schemas/ModeratorNotificationInput'
    responses:
      '201':
        description: Notification sent successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: object
                  nullabe: true
                  example: 'CREATED'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '409':
        $ref: '../swagger.yaml#/components/responses/Conflict'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
