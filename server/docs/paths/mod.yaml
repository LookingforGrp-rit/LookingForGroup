# MOD
/api/mod/clear-profile/{id}:
  patch:
    summary: Clears a user profile
    tags:
      - Mod
    security:
      - shibbolethAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the user whose account will be cleared
        schema:
          type: integer
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    responses:
      '200':
        description: Profile cleared successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  $ref: '../swagger.yaml#/components/schemas/UserDetail'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/mod/user-report/{id}/deactivate:
  patch:
    summary: Deactivates a user report
    tags:
      - Mod
    security:
      - shibbolethAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the user report to be deactivated
        schema:
          type: integer
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    responses:
      '200':
        description: User report successfully deactivated
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: object
                  nullabe: true
                  example: 'NO_CONTENT'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
