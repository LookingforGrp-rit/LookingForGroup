delete:
  summary: Unbans a user by removing them from a blacklist
  tags:
    - Mod
  security:
    - googleOAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: User ID of the user to be unbanned
      schema:
        type: string
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: User unbanned successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                nullabe: true
                example: null
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
