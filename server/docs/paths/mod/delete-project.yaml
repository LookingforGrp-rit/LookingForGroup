delete:
  summary: Deletes a specified project
  tags:
    - Mod
  security:
    - googleOAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the project to be deleted
      schema:
        type: integer
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Project deleted successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                nullabe: true
                example: null
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
