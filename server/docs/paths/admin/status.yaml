get:
  summary: Gets the access level of a user
  tags:
    - Admin
  description: Gets the access level of a given user
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: The ID of the user to get their access level from.
  responses:
    '200':
      description: Access level successfully returned
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                nullable: true
                example: null
              data:
                example: 'User'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
