      '200':
        description: List of socials the current user has
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: array
                  items:
                    $ref: '../swagger.yaml#/components/schemas/Tag'
