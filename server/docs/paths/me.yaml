# ME
/api/me:
  get:
    summary: Gets the current user
    tags:
      - Me
    security:
      - shibbolethAuth: []
    parameters:
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    responses:
      '200':
        description: A single user
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  $ref: '../swagger.yaml#/components/schemas/MePrivate'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
  patch:
    summary: Updates user profile information
    tags:
      - Me
    x-middleware:
      - injectCurrentUser
    security:
      - shibbolethAuth: []
    parameters:
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../swagger.yaml#/components/schemas/UpdateUserInput'
    responses:
      '200':
        description: Update a single user
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  $ref: '../swagger.yaml#/components/schemas/MePrivate'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
  delete:
    summary: Delete a user by ID
    tags:
      - Me
    security:
      - shibbolethAuth: []
    parameters:
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
    responses:
      '200':
        description: User successfully deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: object
                  nullable: true
                  example: null
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/me/get-username:
  get:
    summary: Get username through Shibboleth headers
    tags:
      - Me
    security:
      - shibbolethAuth: []
    description: |
      Retrieves the username of the current user authenticated via Shibboleth. Needs the uid header
    parameters:
      - in: header
        name: uid
        required: true
        schema:
          type: string
        description: Google ID from the Google OAuth response
    responses:
      '200':
        description: Username successfully retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: object
                  properties:
                    username:
                      type: string
                    userId:
                      type: integer
            examples:
              default:
                summary: Example response
                value:
                  status: 200
                  error: null
                  data:
                    username: mistahbones
                    userId: 18
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/me/projects:
  get:
    summary: Get current user's own projects
    description: Returns the list of projects owned by the user identified by userID.
    tags:
      - Me
    security:
      - shibbolethAuth: []
    parameters:
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
      - in: query
        name: visibility
        schema:
          type: string
          enum: [all, public, private]
        required: false
        description: Filter for visibility (accepts all, public, or private)
      - in: query
        name: owner
        schema:
          type: string
          enum: [all, me]
        required: false
        description: Filter for whether or not you are the project owner
    responses:
      '200':
        description: List of projects owned by the user
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: array
                  items:
                    $ref: '../swagger.yaml#/components/schemas/ProjectPreview'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '401':
        $ref: '../swagger.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/me/projects/{id}/leave:
  delete:
    summary: Leave a specified project
    description: Deletes the Members object associated with the logged in user and a project
    tags:
      - Me
    security:
      - shibbolethAuth: []
    parameters:
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
      - in: path
        name: id
        schema:
          type: integer
        required: false
        description: The project ID of the project being left
    responses:
      '200':
        description: Successfully left project
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: object
                  nullable: true
                  example: null
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '401':
        $ref: '../swagger.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
/api/me/projects/{id}/visibility:
  put:
    summary: Set a project's profile visibility
    description: Set the visibility of a project on the user's profile (unique to the user, accepts 'public' or 'private')
    tags:
      - Me
    security:
      - shibbolethAuth: []
    parameters:
      - in: query
        name: devId
        schema:
          type: integer
        required: false
        description: The user ID to be used as the current user
      - in: path
        name: id
        schema:
          type: integer
        required: false
        description: The ID of the project
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              profileVisibility:
                type: string
                example: 'public'
    responses:
      '200':
        description: Visibility set successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                error:
                  type: string
                  nullable: true
                  example: null
                data:
                  type: object
                  $ref: '../swagger.yaml#/components/schemas/MyMember'
      '400':
        $ref: '../swagger.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../swagger.yaml#/components/responses/NotFound'
      '401':
        $ref: '../swagger.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../swagger.yaml#/components/responses/InternalServerError'
