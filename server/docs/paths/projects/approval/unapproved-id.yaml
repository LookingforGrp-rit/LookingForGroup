get:
  summary: Get a specific unapproved project awaiting approval.
  tags:
    - Unapproved Projects
  parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
      description: The project's id.
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  description: Retrieves a list of all projects awaiting approval.
  responses:
    '204':
      description: A list of projects awaiting approval
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: array
                items:
                  $ref: '../../../swagger.yaml#/components/schemas/ProjectDetail'
    '400':
      $ref: '../../../swagger.yaml#/components/responses/Conflict'
    '401':
      $ref: '../../../swagger.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
delete:
  summary: Reject a project approval request.
  tags:
    - Unapproved Projects
  parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
      description: The id of the project being rejected.
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            reason:
              type: string
  responses:
    '200':
      description: Project successfully rejected.
    '400':
      $ref: '../../../swagger.yaml#/components/responses/BadRequest'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
post:
  summary: Request approval for a project
  tags:
    - Unapproved Projects
  parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
      description: The id of the project requesting approval.
    - name: devId
      in: query
      schema:
        type: integer
      required: true
      description: The user Id to be used as the current user.
  security:
    googleOAuth: []
  responses:
    '200':
      description: Approval Request Sent
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '409':
      $ref: '../../../swagger.yaml#/components/responses/Conflict'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
