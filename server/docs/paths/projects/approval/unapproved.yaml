get:
  summary: Get all unapproved projects awaiting approval
  tags:
    - Unapproved Projects
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  description: Retrieves a list of all projects awaiting approval.
  responses:
    '200':
      description: A list of projects awaiting approval
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: array
                items:
                  $ref: '../../../swagger.yaml#/components/schemas/ProjectDetail'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
