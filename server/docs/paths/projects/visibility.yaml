patch:
  summary: Changes the visibility of a project.
  tags:
    - Projects
  parameters:
    - name: id
      in: path
      description: The ID of the project to change visibility
      required: true
      schema:
        type: integer
        example: 42
    - name: devId
      in: query
      description: The ID to be used as 'me'
      required: true
      schema:
        type: integer
        example: 4
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            visibility:
              type: strubg
              enum: [public, private]
  responses:
    '200':
      description: Project visibility updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: string
                nullable: true
                example: null
    '403':
      $ref: '../../swagger.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
