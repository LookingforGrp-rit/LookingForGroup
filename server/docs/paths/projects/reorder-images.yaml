put:
  summary: Reorders the images in a project
  description: Takes the IDs of a project's images and reorders them in the specified project
  security:
    - shibbolethAuth: []
  tags:
    - Projects
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: The ID of the project
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../swagger.yaml#/components/schemas/ReorderProjectImagesInput'
  responses:
    '200':
      description: Images reordered successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: array
                items:
                  $ref: '../../swagger.yaml#/components/schemas/ProjectImage'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '401':
      $ref: '../../swagger.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../../swagger.yaml#/components/responses/Conflict'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
