delete:
  summary: Deletes many of the specified project's mediums
  security:
    - shibbolethAuth: []
  tags:
    - Projects
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: The ID of the project
    - in: path
      name: mediumId
      schema:
        type: integer
      required: true
      description: The ID of the medium
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Mediums deleted successfully
      content:
        application/json:
          example:
            status: 200
            error: null
            data: null
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
