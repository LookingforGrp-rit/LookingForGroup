get:
  tags:
    - Projects
  summary: Get list of users that are following the specified project
  parameters:
    - name: id
      in: path
      description: Project ID
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: List of users following the specified project
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                $ref: '../../swagger.yaml#/components/schemas/ProjectFollowers'
    '400':
      $ref: '../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../swagger.yaml#/components/responses/InternalServerError'
