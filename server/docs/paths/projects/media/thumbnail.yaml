get:
  summary: Get thumbnail by project ID
  tags:
    - Project Images & Videos
  description: Gets a prject's thumbnail by its ID.
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: Project ID
  responses:
    '200':
      description: Thumbnail found and returned
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                $ref: '../../../swagger.yaml#/components/schemas/ProjectImage'
    '400':
      $ref: '../../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
put:
  summary: Updates a thumbnail
  tags:
    - Project Images & Videos
  security:
    - shibbolethAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: The project ID
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            thumbnail:
              type: integer
              required: true
  responses:
    '200':
      description: Project thumbnail successfully updated
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                $ref: '../../../swagger.yaml#/components/schemas/ProjectImage'
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
delete:
  summary: Remove a project's thumbnail
  description: Removes a project's thumbnail by the project's ID. This does NOT delete the project image itself.
  tags:
    - Project Images & Videos
  security:
    - shibbolethAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: The ID of the project whose thumbnail to remove
      schema:
        type: integer
    - name: devId
      in: query
      required: false
      description: The ID to be used as the current user
      schema:
        type: integer
  responses:
    '200':
      description: Thumbnail removed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                nullable:
                example: null
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
