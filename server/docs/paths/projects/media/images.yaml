get:
  summary: Get project pictures by ID
  tags:
    - Project Images & Videos
  description: |
    Gets all images that are with a specific project by the project ID
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: Project ID
  responses:
    '200':
      description: A list of images with the project
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: array
                items:
                  $ref: '../../../swagger.yaml#/components/schemas/ProjectImage'
    '400':
      $ref: '../../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
post:
  summary: Add a new picture to a project
  description: Creates a new picture entry associated with a specific project.
  tags:
    - Project Images & Videos
  security:
    - shibbolethAuth: []
  parameters:
    - name: id
      in: path
      description: The ID of the project to add a picture to
      required: true
      schema:
        type: integer
        example: 42
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../../swagger.yaml#/components/schemas/CreateProjectImageInput'
  responses:
    '201':
      description: Picture added successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                $ref: '../../../swagger.yaml#/components/schemas/ProjectImage'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
