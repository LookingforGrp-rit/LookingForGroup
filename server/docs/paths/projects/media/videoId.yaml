delete:
  summary: Add a new video to a project
  description: Creates a new video entry associated with a specific project.
  tags:
    - Project Images & Videos
  security:
    - shibbolethAuth: []
  parameters:
    - name: id
      in: path
      description: The ID of the project to delete a video from
      required: true
      schema:
        type: integer
        example: 5
    - name: videoId
      in: path
      description: The ID of the video
      required: true
      schema:
        type: integer
        example: 42
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Video deleted successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: string
                nullable: true
                example: null
    '403':
      $ref: '../../../swagger.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
