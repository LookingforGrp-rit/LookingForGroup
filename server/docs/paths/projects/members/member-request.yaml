get:
  summary: Gets a member request
  description: Gets the member request associated to the id and data in query
  tags:
    - Project Members
  security:
    - shibbolethAuth: []
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
    - in: query
      name: requestId
      schema:
        type: integer
      required: false
      description: The ID of the request. If requestId is provided, the others are optional. If requestId is not provided, require the other three (prospectiveMemberId, projectId, roleId).
    - in: query
      name: prospectiveMemberId
      schema:
        type: integer
      required: false
      description: The user ID of the prospective member
    - in: query
      name: projectId
      schema:
        type: integer
      required: false
      description: The project ID associated to the request
    - in: query
      name: roleId
      schema:
        type: integer
      required: false
      description: The role ID associated to the request
  responses:
    '200':
      description: Request Successful
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                $ref: '../../../swagger.yaml#/components/schemas/ProjectMemberRequest'
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
patch:
  summary: Updates a member request
  description: Checks that the user is the receiver of the request, then updates it if it is
  tags:
    - Project Members
  security:
    - shibbolethAuth: []
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: The ID of the request
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          minProperties: 1
          properties:
            requestStatus:
              type: string
              enum:
                - Accepted
                - Declined
                - Pending
              example: Pending
            roleId:
              type: integer
              example: 3
  responses:
    '200':
      description: Request Successful
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: string
                nullable: true
                example: null
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '403':
      $ref: '../../../swagger.yaml#/components/responses/Forbidden'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
delete:
  summary: Deletes a member request
  description: Checks that the user is the sender of the request, then deletes it if it is
  tags:
    - Project Members
  security:
    - shibbolethAuth: []
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: The ID of the request
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Request Successful
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: string
                nullable: true
                example: null
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '403':
      $ref: '../../../swagger.yaml#/components/responses/Forbidden'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
