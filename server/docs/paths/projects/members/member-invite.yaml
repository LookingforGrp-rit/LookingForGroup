patch:
  summary: Update a pending member's role in a project
  security:
    - googleOAuth: []
  tags:
    - Project Members
  description: Updates the role or other properties of a pending member in a project.
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: Project ID
    - in: path
      name: userId
      required: true
      schema:
        type: integer
      description: The ID of the member to update
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../swagger.yaml#/components/schemas/UpdateProjectMemberInput'
  responses:
    '200':
      description: Member updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                $ref: '../../../swagger.yaml#/components/schemas/ProjectMember'
    '400':
      $ref: '../../../swagger.yaml#/components/responses/BadRequest'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
delete:
  summary: Remove a member from a project
  tags:
    - Project Members
  description: Deletes a member from a project by specifying the user ID in the query parameters.
  security:
    - googleOAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: Project ID
    - in: path
      name: userId
      required: true
      schema:
        type: integer
      description: The ID of the user to remove
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Member removed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                nullable: null
                example: null
    '400':
      $ref: '../../../swagger.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
