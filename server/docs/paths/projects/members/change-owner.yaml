patch:
  summary: Changes the owner of a project
  security:
    - googleOAuth: []
  tags:
    - Project Members
  description: Changes the owner of a project.
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: Project ID
    - in: path
      name: userId
      required: true
      schema:
        type: integer
      description: The ID of the new owner
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Owner changed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: object
                $ref: '../../../swagger.yaml#/components/schemas/ProjectMember'
    '400':
      $ref: '../../../swagger.yaml#/components/responses/BadRequest'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
