get:
  summary: Gets all member request invitations for a user
  description: Gets all invitations for a user
  tags:
    - Projects Members
  security:
    - shibbolethAuth: []
  parameters:
    - in: query
      name: devId
      schema:
        type: integer
      required: false
      description: The user ID to be used as the current user
  responses:
    '200':
      description: Request Successful
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              error:
                type: string
                nullable: true
                example: null
              data:
                type: array
                items:
                  $ref: '../../../swagger.yaml#/components/schemas/CreateMemberRequestInput'
    '404':
      $ref: '../../../swagger.yaml#/components/responses/NotFound'
    '409':
      $ref: '../../../swagger.yaml#/components/responses/Conflict'
    '500':
      $ref: '../../../swagger.yaml#/components/responses/InternalServerError'
