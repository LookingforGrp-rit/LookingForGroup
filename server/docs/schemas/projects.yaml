components:
  schemas:
    ProjectImage:
      type: object
      properties:
        imageId:
          type: integer
        image:
          type: string
        altText:
          type: string
        apiUrl:
          type: string
      example:
        imageId: 1
        image: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSK9gJACNLV5RJ5RC8Me7u3GRvAQ-w8DHNqNw&s
        altText: cat yawning
        apiUrl: /api/projects/1/images/1

    ProjectVideo:
      type: object
      properties:
        videoId:
          type: integer
        videoUrl:
          type: string
        position:
          type: integer
        title:
          type: string
        projectId:
          type: integer
      example:
        videoId: 1
        videoUrl: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        position: 0
        title: Never Gonna Give You Up
        projectId: 1

    ProjectMedium:
      allOf:
        - $ref: 'datasets.yaml#/components/schemas/Medium'
        - type: object
          properties:
            apiUrl:
              type: string
      example:
        mediumId: 1
        label: Video Game
        apiUrl: /api/projects/1/mediums

    ProjectFollower:
      type: object
      properties:
        user:
          $ref: 'users.yaml#/components/schemas/UserPreview'
        followedAt:
          type: string
          format: date-time

    ProjectFollowers:
      type: object
      properties:
        count:
          type: integer
        users:
          type: array
          items:
            $ref: '#/components/schemas/ProjectFollower'
        apiUrl:
          type: string
      example:
        count: 1
        users: []
        apiUrl: /api/projects/1/followers

    ProjectMember:
      type: object
      properties:
        user:
          $ref: 'users.yaml#/components/schemas/UserPreview'
        role:
          $ref: 'datasets.yaml#/components/schemas/Role'
        memberSince:
          type: string
          format: date-time
        apiUrl:
          type: string
      example:
        user:
          userId: 1
          firstName: Michael
          lastName: Robinson
          username: mhr2964
          profileImage: null
          mentor: false
          designer: false
          developer: true
          apiUrl: /api/users/1
        role:
          roleId: 1
          label: Full-Stack Developer
        memberSince: 2038-01-19 03:14:07
        apiUrl: /api/projects/1/members/1

    ProjectMemberRequest:
      type: object
      properties:
        requestId: integer
        prospectiveMemberId: integer
        projectId: integer
        roleId: integer
        sentFromProject: boolean
        requestStatus: 'enums.yaml#/components/schemas/MemberRequestStatus'
      example:
        requestId: 1
        prospectiveMemberId: 2
        projectId: 1
        roleId: 3
        sentFromProject: true
        requestStatus: 'Pending'

    ProjectSocial:
      allOf:
        - $ref: 'datasets.yaml#/components/schemas/Social'
        - type: object
          properties:
            id:
              type: integer
            url:
              type: string
            alias:
              type: string
            apiUrl:
              type: string
      example:
        id: 1
        websiteId: 1
        label: Instagram
        url: https://www.instagram.com/rittigers/
        alias: '@rittigers'
        apiUrl: /api/projects/1/socials/1

    ProjectTag:
      allOf:
        - $ref: 'datasets.yaml#/components/schemas/Tag'
        - type: object
          properties:
            apiUrl:
              type: string
      example:
        tagId: 1
        label: Indie
        type: Creative
        apiUrl: /api/projects/1/tags/1

    ProjectJob:
      type: object
      properties:
        jobId:
          type: integer
        role:
          $ref: 'datasets.yaml#/components/schemas/Role'
        availability:
          type: 'enums.yaml#/components/schemas/JobAvailability'
        jobStart:
          type: string
          format: date-time
        jobEnd:
          type: string
          format: date-time
        location:
          type: 'enums.yaml#/components/schemas/JobLocation'
        compensation:
          type: 'enums.yaml#/components/schemas/JobCompensation'
        contact:
          $ref: 'users.yaml#/components/schemas/UserPreview'
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        apiUrl:
          type: string
      example:
        jobId: 1
        role:
          roleId: 1
          label: Full-Stack Developer
        availability: FullTime
        jobStart: 1900-01-01
        jobEnd: 1900-01-01
        location: OnSite
        compensation: Unpaid
        contact:
          userId: 1
          firstName: Michael
          lastName: Robinson
          username: mhr2964
          profileImage: null
          mentor: false
          designer: false
          developer: true
          apiUrl: /api/users/1
        description: i'm a job
        createdAt: 2038-01-19 03:14:07
        updatedAt: 2038-01-19 03:14:07
        apiUrl: /api/projects/1/jobs/1

    ProjectPreview:
      type: object
      properties:
        projectId:
          type: integer
        title:
          type: string
        globalVisibility:
          type: string
          enum: ['public', 'private']
        hook:
          type: string
        thumbnail:
          type: string
          nullable: true
        mediums:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMedium'
        apiUrl:
          type: string
      example:
        projectId: 1
        title: Looking For Group
        hook: You can LOOK for a GROUP
        mediums: []
        thumbnail: null
        apiUrl: /api/projects/1

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectPreview'
        - type: object
          properties:
            description:
              type: string
            context:
              type: 'enums.yaml#/components/schemas/ProjectContext'
              nullable: true
            status:
              type: 'enums.yaml#/components/schemas/ProjectStatus'
            audience:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            owner:
              $ref: 'users.yaml#/components/schemas/UserPreview'
            tags:
              type: array
              items:
                $ref: '#/components/schemas/ProjectTag'
            projectImages:
              type: array
              items:
                $ref: '#/components/schemas/ProjectImage'
            projectSocials:
              type: array
              items:
                $ref: '#/components/schemas/ProjectSocial'
            jobs:
              type: array
              items:
                $ref: '#/components/schemas/ProjectJob'
            members:
              type: array
              items:
                $ref: '#/components/schemas/ProjectMember'
      example:
        projectId: 1
        title: Looking For Group
        hook: You can LOOK for a GROUP
        mediums: []
        thumbnail: null
        description: Have you ever needed a project or a group?
        context: Personal
        status: Planning
        audience: Everybody
        createdAt: 2038-01-19 03:14:07
        updatedAt: 2038-01-19 03:14:07
        owner:
          userId: 1
          firstName: Michael
          lastName: Robinson
          username: mhr2964
          profileImage: null
          mentor: false
          designer: false
          developer: true
          apiUrl: /api/users/1
        tags: []
        projectImages: []
        projectSocials: []
        jobs: []
        members: []
        apiUrl: /api/projects/1

    ProjectWithFollowers:
      allOf:
        - $ref: '#/components/schemas/ProjectDetail'
        - type: object
          properties:
            projectId: 1
            title: Looking For Group
            hook: You can LOOK for a GROUP
            mediums: []
            thumbnail: null
            description: Have you ever needed a project or a group?
            context: Personal
            status: Planning
            audience: Everybody
            createdAt: 2038-01-19 03:14:07
            updatedAt: 2038-01-19 03:14:07
            owner:
              userId: 1
              firstName: Michael
              lastName: Robinson
              username: mhr2964
              profileImage: null
              mentor: false
              designer: false
              developer: true
              apiUrl: /api/users/1
            tags: []
            projectImages: []
            projectSocials: []
            jobs: []
            members: []
            followers:
              count: 1
              users: []
              apiUrl: /api/projects/1/followers
            apiUrl: /api/projects/1

    ProjectReport:
      type: object
      properties:
        apiUrl:
          type: string
        reportId:
          type: integer
        userId:
          type: integer
        projectId:
          type: integer
        reason:
          type: string
      example:
        apiUrl: /api/mod/project-report/1
        reportId: 1
        userId: 2
        projectId: 3
        reason: Inappropriate content.
