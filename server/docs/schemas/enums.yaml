components:
  schemas:
    SkillType:
      type: string
      enum:
        - Developer
        - Designer
        - Artist
        - Music
        - Soft
      example: Developer

    SkillCategory:
      type: string
      enum:
        - Discipline
        - Framework
        - Software
        - Coding Language
        - Operating System
        - Game Engine
        - Design Software
        - Art and Animation
        - Photo Editing
        - Video Software
        - DAW/Audio Editor
        - Notation
        - Middleware
        - Personal
        - Team
        - Engineering Software
        - Hardware
        - Other

    TagType:
      type: string
      enum:
        - Creative
        - Technical
        - Games
        - Multimedia
        - Music
        - Other
        - Developer Skill
        - Designer Skill
        - Soft Skill
        - Purpose
      example: Creative

    TagCategory:
      type: string
      enum:
        - Game
        - Story
        - Music
        - Visual
        - Film/Video
        - Unity
        - Unreal Engine
        - Godot
        - Twine
        - Monogame
        - Other

    RitStatus:
      type: string
      enum:
        - Freshman
        - Sophomore
        - Junior
        - Senior
        - Graduate
        - Faculty
      example: Freshman

    Visibility:
      type: string
      enum: ['public', 'private']
      example: public

    SkillProficiency:
      type: string
      enum:
        - Novice
        - Intermediate
        - Advanced
        - Expert
      example: Novice

    ProjectPurpose:
      type: string
      enum:
        - Personal
        - PortfolioPiece
        - Academic
        - CoOp
      example: Personal

    ProjectStatus:
      type: string
      enum:
        - Planning
        - Development
        - PostProduction
        - Complete
      example: Planning

    JobAvailability:
      type: string
      enum:
        - FullTime
        - PartTime
        - Flexible
      example: FullTime

    JobDuration:
      type: string
      enum:
        - Days
        - Weeks
        - Months
        - Semesters
        - Years
      example: Days

    JobLocation:
      type: string
      enum:
        - OnSite
        - Remote
        - Hybrid
      example: OnSite

    JobCompensation:
      type: string
      enum:
        - Unpaid
        - Paid
      example: Unpaid

    MemberRequestStatus:
      type: string
      enum:
        - Pending
        - Accepted
        - Declined
      example: Pending
